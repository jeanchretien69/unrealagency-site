name: Generate Kaya gaze grid

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test (3 images) or full (whole grid)"
        default: "test"
        required: true
      grid:
        description: "grid size N (N x N images)"
        default: "11"
        required: true

permissions:
  contents: write

jobs:
  gaze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow "rembg[cpu]" onnxruntime opencv-python-headless numpy
      - name: Generate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          MODE: ${{ github.event.inputs.mode }}
          GRID: ${{ github.event.inputs.grid }}
        run: python tools/gaze_grid.py
      - name: Commit images
        run: |
          git config user.name "gaze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gaze
          git commit -m "Kaya gaze grid (${{ github.event.inputs.mode }})" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
