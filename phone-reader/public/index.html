<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phone</title>
<style>
:root{--pink:#ff4fa3;--pink2:#ff86c1;--bg:#0b0b10;--card:#15151d;--line:#262633;--tx:#f5f5fa;--mu:#9a9ab0}
@media (prefers-color-scheme:light){:root{--bg:#f6f3f7;--card:#fff;--line:#e6dfe9;--tx:#1a1a22;--mu:#6c6c80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:2px;position:relative}
.dev{position:relative;display:flex;align-items:center;justify-content:center;height:100%;max-height:100%}
.frame{position:relative;padding:5px;border-radius:34px;background:linear-gradient(145deg,#2a2a36,#0c0c12);box-shadow:0 0 0 2px #3a3a48,0 0 0 5px rgba(255,79,163,.18),0 30px 80px rgba(255,79,163,.18),0 20px 50px rgba(0,0,0,.45);transition:box-shadow .3s}
.frame.live{box-shadow:0 0 0 2px #3a3a48,0 0 0 5px rgba(255,79,163,.45),0 30px 90px rgba(255,79,163,.3),0 20px 50px rgba(0,0,0,.45)}
.frame:before{display:none}
.screen{position:relative;border-radius:29px;overflow:hidden;background:#000;line-height:0}
canvas{display:block;touch-action:none;cursor:pointer;outline:none;background:#000}
#rv{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;pointer-events:none;opacity:0;background:#000}
#rv.on{opacity:1}
#pwrM{display:none;position:absolute;top:6px;right:6px;z-index:6;width:30px;height:30px;padding:0;border-radius:50%;border:0;background:rgba(20,20,28,.72);color:#fff;font-size:15px;align-items:center;justify-content:center;opacity:.75}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;line-height:1.4;color:#fff;background:radial-gradient(circle at 50% 35%,rgba(255,79,163,.18),#07070b 70%);transition:opacity .35s}
.ov.hide{opacity:0;pointer-events:none}
.ov b{font-size:16px}.ov span{color:#b9b9cc;font-size:13px;max-width:240px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--pink);animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.ov button{margin-top:6px}
.side{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-width:128px}
.side h4{margin:0 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;text-align:left}
button:hover{border-color:var(--pink);background:rgba(255,79,163,.08)}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:transparent;color:#fff;font-weight:600;justify-content:center}
.st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);padding:2px 2px 6px}
.dot{width:8px;height:8px;border-radius:50%;background:#777}
.dot.live{background:#34d399;box-shadow:0 0 8px #34d399}.dot.err{background:#f87171}.dot.starting{background:#fbbf24;animation:b 1s infinite}
@keyframes b{50%{opacity:.3}}
.sp{height:1px;background:var(--line);margin:4px 0}
.row2{display:flex;gap:8px}.row2 button{flex:1;justify-content:center;padding:9px 0}
.toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.fs .stage{padding:0}.fs .side{display:none}
@media (max-width:640px){
  .stage{flex-direction:column;gap:6px;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .side{display:none}
  #pwrM{display:flex}
  .side h4,.sp,.st,.hideM,#bFs{display:none}
  .side button{flex:1;justify-content:center;padding:8px 0;font-size:16px;border-radius:12px}
  .frame{padding:0;border-radius:18px;background:none;box-shadow:none}.frame.live{box-shadow:none}.screen{border-radius:18px}
  html,body{background:#000}
  .stage{padding:0 0 env(safe-area-inset-bottom)}
  .side{background:#111117;border-color:#22222c}.side button{color:#f2f2f7;border-color:#2a2a35;background:#17171f}
}
</style></head><body>
<div class="stage" id="stage">
  <div class="dev"><div class="frame" id="frame"><div class="screen" id="screen">
    <canvas id="cv" tabindex="0" width="360" height="760"></canvas>
    <video id="rv" muted playsinline autoplay></video>
    <div class="ov" id="ov"><div class="spin" id="spin"></div><b id="ovT">Connecting…</b><span id="ovS">Opening the phone</span><button class="pri" id="ovB" hidden>Try again</button></div>
  </div></div></div>
  <div class="side" id="side">
    <div class="st"><i class="dot" id="dot"></i><span class="t" id="stT">Connecting</span></div>
    <h4>Phone</h4>
    <button data-k="3" title="Home">⬤ <span class="hideM">Home</span></button>
    <button id="bBack" title="Back">◀ <span class="hideM">Back</span></button>
    <button data-k="187" title="Recent apps">▣ <span class="hideM">Recent</span></button>
    <div class="sp"></div>
    <button data-k="26" title="Power / screen on-off">⏻ <span class="hideM">Power</span></button>
    <div class="sp"></div>
    <button class="pri" id="bFs">⛶ <span class="hideM">Full screen</span></button>
    <div class="st hideM" style="padding-top:8px"><span id="lat">&nbsp;</span></div>
  </div>
  <button id="pwrM" title="Power" aria-label="Power">⏻</button>
  <div class="toast" id="toast"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let ws, dec, vw = 0, vh = 0, needKey = true, hadConfig = null, state = 'connecting', lastFrame = 0, lastMsg = 0, retryT = null, lagBad = 0, base = Infinity, lastAsk = 0;
const askKey = () => { const n = performance.now(); if (n - lastAsk > 3000 && ws && ws.readyState === 1) { lastAsk = n; ws.send(new Uint8Array([0xff])); } };
const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); };
function ui(st, title, sub, retry) {
  state = st; $('#dot').className = 'dot ' + (st === 'live' ? 'live' : st === 'error' ? 'err' : 'starting');
  $('#stT').textContent = st === 'live' ? (typeof rtcOn !== 'undefined' && rtcOn ? 'Live ⚡' : 'Live') : st === 'error' ? 'Problem' : 'Connecting';
  $('#frame').classList.toggle('live', st === 'live');
  const ov = $('#ov'); ov.classList.toggle('hide', st === 'live');
  $('#ovT').textContent = title || ''; $('#ovS').textContent = sub || ''; $('#spin').hidden = st === 'error'; $('#ovB').hidden = !retry;
}
function fit() {
  if (!vw) return;
  const side = $('#side'), narrow = innerWidth <= 640, fs = document.body.classList.contains('fs');
  const H = window.visualViewport ? visualViewport.height : innerHeight;
  const aw = innerWidth - (narrow ? 0 : fs ? 0 : side.offsetWidth + 46), ah = H - (narrow ? 2 : 4);
  const pad = fs ? 0 : narrow ? 0 : 10, r = vw / vh;
  let h = Math.min(ah - pad, (aw - pad) / r); h = Math.max(h, 120);
  cv.style.height = h + 'px'; cv.style.width = h * r + 'px';
}
addEventListener('resize', fit); window.visualViewport && visualViewport.addEventListener('resize', fit);

// ---------- video ----------
function nals(b) { const o = []; let i = 0, st = -1; while (i + 3 <= b.length) { if (b[i] === 0 && b[i + 1] === 0 && (b[i + 2] === 1 || (b[i + 2] === 0 && i + 3 < b.length && b[i + 3] === 1))) { if (st >= 0) o.push(b.subarray(st, i)); i += b[i + 2] === 1 ? 3 : 4; st = i; } else i++; } if (st >= 0 && st < b.length) o.push(b.subarray(st)); return o.map(n => { let e = n.length; while (e > 1 && n[e - 1] === 0) e--; return n.subarray(0, e); }).filter(n => n.length); }
function toAvcc(b) { const list = nals(b).filter(n => { const t = n[0] & 31; return t !== 7 && t !== 8 && t !== 9; }); let len = 0; list.forEach(n => len += 4 + n.length); const out = new Uint8Array(len); const dv = new DataView(out.buffer); let o = 0; list.forEach(n => { dv.setUint32(o, n.length); out.set(n, o + 4); o += 4 + n.length; }); return out; }
function avcC(sps, pps) { const a = new Uint8Array(11 + sps.length + pps.length); a.set([1, sps[1], sps[2], sps[3], 0xff, 0xe1, sps.length >> 8, sps.length & 255]); a.set(sps, 8); let o = 8 + sps.length; a.set([1, pps.length >> 8, pps.length & 255], o); a.set(pps, o + 3); return a; }
let lastErr = '', codecStr = '';
function codecString(sps) { const b = [sps[1], sps[2], sps[3]].map(x => x.toString(16).padStart(2, '0')).join(''); return 'avc1.' + b; }
function findSps(data) { for (let i = 0; i + 4 < data.length; i++) if (data[i] === 0 && data[i + 1] === 0 && (data[i + 2] === 1 || (data[i + 2] === 0 && data[i + 3] === 1))) { const o = data[i + 2] === 1 ? i + 3 : i + 4; if ((data[o] & 31) === 7) return data.subarray(o); } return null; }
const SAFARI = /Apple/.test(navigator.vendor || '');
let pending = 0, flushT = null;
function makeDecoder() { pending = 0;
  try { dec?.close(); } catch {}
  dec = new VideoDecoder({
    output: f => { pending = Math.max(0, pending - 1); if (cv.width !== f.displayWidth || cv.height !== f.displayHeight) { cv.width = f.displayWidth; cv.height = f.displayHeight; } if (!rtcOn) ctx.drawImage(f, 0, 0); f.close(); lastFrame = performance.now(); if (state !== 'live') ui('live'); rtcStart(); },
    error: e => { lastErr = 'decode: ' + (e && e.message || e); needKey = true; askKey(); },
  });
}
function onBinary(buf) {
  const u = new Uint8Array(buf), t = u[0];
  if (t === 1) { const dv = new DataView(buf); const w = dv.getUint32(1), h = dv.getUint32(5); if (w !== vw || h !== vh) { vw = w; vh = h; cv.width = vw; cv.height = vh; fit(); } needKey = true; return; }
  if (t === 2) {
    const c = u.slice(1); if (hadConfig && dec && dec.state === 'configured' && c.length === hadConfig.length && c.every((x, i) => x === hadConfig[i])) return;
    hadConfig = c; const list = nals(c), sps = list.find(n => (n[0] & 31) === 7), pps = list.find(n => (n[0] & 31) === 8);
    if (sps && pps) { makeDecoder(); codecStr = codecString(sps); try { dec.configure({ codec: codecStr, description: avcC(sps, pps), optimizeForLatency: true }); } catch (e) { lastErr = 'configure: ' + e.message; } needKey = true; }
    return;
  }
  if (t === 3) {
    if (!dec || dec.state !== 'configured') return;
    const key = u[1] === 1, sent = new DataView(buf, 2, 8).getFloat64(0), body = u.subarray(10);
    if (needKey && !key) { askKey(); return; }
    // too far behind live? ask for a fresh image instead of showing old ones
    const raw = Date.now() - sent; base = Math.min(base, raw); const lag = raw - base; lagBad = lag > 1500 ? lagBad + 1 : 0;
    if (lagBad > 90) { lagBad = 0; base = Infinity; needKey = true; askKey(); return; }
    const chunkData = toAvcc(body); if (!chunkData.length) return;
    needKey = false;
    try { dec.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: performance.now() * 1000, data: chunkData })); pending++; } catch { needKey = true; }

    if (!rtcOn) $('#lat').textContent = lag > 250 ? 'Behind ' + Math.round(lag) + ' ms' : '';
  }
}
function connect() {
  clearTimeout(retryT);
  if (!('VideoDecoder' in window)) return ui('error', 'Update your browser', 'This browser cannot show the phone video. Use an up-to-date Chrome, Edge or Safari.', false);
  ui('connecting', 'Connecting…', 'Opening the phone');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); ws.binaryType = 'arraybuffer';
  ws.onmessage = e => {
    lastMsg = performance.now();
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data); if (m.ping) return;
      if (m.webrtc) { if (m.webrtc === 'offer') rtcOffer(m.sdp); else if (m.webrtc === 'failed') rtcStop(false); return; }
      if (m.state === 'error') ui('error', 'Phone not reachable', m.error || 'Reconnecting…', false);
      else if (m.state === 'starting' || m.state === 'idle') ui('connecting', 'Waking the phone…', m.name || 'This takes a few seconds');
      return;
    }
    onBinary(e.data);
  };
  ws.onclose = () => { base = Infinity; rtcStop(false); if (state === 'live') ui('connecting', 'Reconnecting…', 'Connection dropped'); retryT = setTimeout(connect, 2000); };
  ws.onerror = () => {};
}
// frozen image? ask for a fresh one; nothing for a while? reconnect on its own
// a still screen sends no pictures: that's normal. Only reconnect if the server itself goes silent.
setInterval(() => { if (state === 'live' && ws && ws.readyState === 1 && performance.now() - lastMsg > 35000) ws.close(); }, 5000);
$('#ovB').onclick = connect;

// ---------- sending to the phone (scrcpy binary messages) ----------
const send = b => { if (ws && ws.readyState === 1 && state === 'live') ws.send(b); };
function keycode(code, action) { const b = new DataView(new ArrayBuffer(14)); b.setUint8(0, 0); b.setUint8(1, action); b.setInt32(2, code); b.setInt32(6, 0); b.setInt32(10, 0); return b.buffer; }
function tap(code) { send(keycode(code, 0)); setTimeout(() => send(keycode(code, 1)), 40); }
function touch(action, x, y, down) {
  const b = new DataView(new ArrayBuffer(32)); b.setUint8(0, 2); b.setUint8(1, action); b.setBigInt64(2, -2n);
  b.setInt32(10, Math.round(x)); b.setInt32(14, Math.round(y)); b.setUint16(18, vw); b.setUint16(20, vh);
  b.setUint16(22, down ? 0xffff : 0); b.setInt32(24, 0); b.setInt32(28, 0); send(b.buffer);
}
function text(s) { const e = new TextEncoder().encode(s.slice(0, 100)); const b = new DataView(new ArrayBuffer(5 + e.length)); b.setUint8(0, 1); b.setUint32(1, e.length); new Uint8Array(b.buffer, 5).set(e); send(b.buffer); }
function simple(t) { send(new Uint8Array([t]).buffer); }
function pos(e) { const r = cv.getBoundingClientRect(); return [Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * vw, Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1) * vh]; }
let isDown = false;
cv.addEventListener('pointerdown', e => { if (rv.srcObject && rv.paused) rv.play().catch(() => {}); if (!vw) return; cv.focus(); cv.setPointerCapture(e.pointerId); isDown = true; touch(0, ...pos(e), true); e.preventDefault(); });
cv.addEventListener('pointermove', e => { if (isDown) { touch(2, ...pos(e), true); e.preventDefault(); } });
const up = e => { if (!isDown) return; isDown = false; touch(1, ...pos(e), false); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => { e.preventDefault(); send(new Uint8Array([4, 0]).buffer); send(new Uint8Array([4, 1]).buffer); }); // right click = Back
cv.addEventListener('wheel', e => {
  e.preventDefault(); const [x, y] = pos(e); const b = new DataView(new ArrayBuffer(21)); b.setUint8(0, 3);
  b.setInt32(1, Math.round(x)); b.setInt32(5, Math.round(y)); b.setUint16(9, vw); b.setUint16(11, vh);
  const f = d => Math.max(-32768, Math.min(32767, Math.round(-d / 100 * 32768 / 16 * 3)));
  b.setInt16(13, f(e.deltaX)); b.setInt16(15, f(e.deltaY)); b.setInt32(17, 0); send(b.buffer);
}, { passive: false });
const KEYS = { Enter: 66, Backspace: 67, Tab: 61, Escape: 4, Delete: 112, ArrowUp: 19, ArrowDown: 20, ArrowLeft: 21, ArrowRight: 22, Home: 122, End: 123, PageUp: 92, PageDown: 93, ' ': 62 };
cv.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;               // Cmd+V is handled by the paste event
  if (e.key.length === 1 && e.key !== ' ') { text(e.key); e.preventDefault(); }
  else if (KEYS[e.key]) { tap(KEYS[e.key]); e.preventDefault(); }
});
cv.addEventListener('paste', e => { const t = e.clipboardData?.getData('text'); if (t) { clip(t); e.preventDefault(); } });
function clip(t) { const e = new TextEncoder().encode(t.slice(0, 20000)); const b = new DataView(new ArrayBuffer(14 + e.length)); b.setUint8(0, 9); b.setBigInt64(1, 0n); b.setUint8(9, 1); b.setUint32(10, e.length); new Uint8Array(b.buffer, 14).set(e); send(b.buffer); toast('Pasted'); }
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { tap(+b.dataset.k); cv.focus(); });
$('#pwrM').onclick = () => tap(26);
$('#bBack').onclick = () => { send(new Uint8Array([4, 0]).buffer); send(new Uint8Array([4, 1]).buffer); cv.focus(); };
$('#bFs').onclick = () => { const on = document.body.classList.toggle('fs'); try { if (on) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); } catch {} setTimeout(fit, 50); };
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('fs'); setTimeout(fit, 50); });
// text sent from the notepad next to the phone on unrealagency.ai
const PARENTS = ['https://unrealagency.ai', 'https://www.unrealagency.ai'];
addEventListener('message', e => {
  if (!PARENTS.includes(e.origin) || e.data?.type !== 'unreal-phone') return;
  if (e.data.action === 'ping') e.source.postMessage({ type:'unreal-phone', ready:true }, e.origin);
  if (e.data.action === 'paste' && typeof e.data.text === 'string' && e.data.text) {
    if (state !== 'live') return toast('Phone not connected yet');
    clip(e.data.text); e.source.postMessage({ type:'unreal-phone', sent:true }, e.origin);
  }
});
try { parent !== window && PARENTS.forEach(o => parent.postMessage({ type:'unreal-phone', ready:true }, o)); } catch {}
// ---------- WebRTC video (falls back to the WebSocket picture on its own) ----------
const rv = $('#rv'); let pc = null, rtcOn = false, rtcTried = 0;
let liveSince = 0;
setInterval(() => {
  if (state !== 'live') { liveSince = 0; return; } if (!liveSince) liveSince = performance.now();
  if (!lastFrame && performance.now() - liveSince > 6000) { $('#ov').classList.remove('hide'); $('#spin').hidden = true; $('#ovT').textContent = 'Picture not showing'; $('#ovS').textContent = (rtcOn ? 'fast' : 'normal') + ' · ' + (codecStr || 'no codec') + ' · ' + (dec ? dec.state : 'no decoder') + (lastErr ? ' · ' + lastErr : '') + ' — send me this line'; $('#ovB').hidden = false; }
  else if (lastFrame && !$('#ov').classList.contains('hide') && state === 'live') $('#ov').classList.add('hide');
}, 1500);
setInterval(() => { if (rtcOn && rv.paused) rv.play().catch(() => rtcStop(true)); else if (pc && !rtcOn && rv.paused && rv.srcObject) rv.play().catch(() => {}); }, 1000);
function rtcStart() { if (!('RTCPeerConnection' in window) || pc || !ws || ws.readyState !== 1 || Date.now() - rtcTried < 20000) return; rtcTried = Date.now(); ws.send(JSON.stringify({ webrtc: 'start' })); }
function rtcStop(tell) {
  const was = rtcOn; rtcOn = false; rv.classList.remove('on'); if (state === 'live') $('#stT').textContent = 'Live'; try { pc && pc.close(); } catch {} pc = null; rv.srcObject = null;
  if (tell && ws && ws.readyState === 1) ws.send(JSON.stringify({ webrtc: 'stop' }));
  needKey = true; askKey();
}
async function rtcOffer(sdp) {
  try {
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }, { urls: 'stun:stun.l.google.com:19302' }] });
    pc.ontrack = e => {
      try { e.receiver.jitterBufferTarget = 0; } catch {} try { e.receiver.playoutDelayHint = 0; } catch {}
      rv.srcObject = e.streams && e.streams[0] ? e.streams[0] : new MediaStream([e.track]); rv.play().catch(() => {});
      let frames = 0;
      const go = () => { if (rtcOn || !pc) return; rtcOn = true; rv.classList.add('on'); $('#lat').textContent = ''; ui('live'); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ webrtc: 'playing' })); };
      const tick = () => { if (!pc) return; if (!rv.paused) { frames++; if (rtcOn) lastFrame = performance.now(); if (frames >= 8) go(); } rv.requestVideoFrameCallback(tick); };
      if (rv.requestVideoFrameCallback) rv.requestVideoFrameCallback(tick); else rv.addEventListener('timeupdate', () => { if (!rv.paused && rv.currentTime > 0.3) go(); });
      // Safari may refuse to play it: then stay on the normal picture
      setTimeout(() => { if (pc && !rtcOn) rtcStop(true); }, 8000);
    };
    pc.onconnectionstatechange = () => { if (pc && ['failed', 'closed'].includes(pc.connectionState)) rtcStop(true); };
    await pc.setRemoteDescription({ type: 'offer', sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await new Promise(r => { if (pc.iceGatheringState === 'complete') return r(); const t = setTimeout(r, 2000); pc.onicegatheringstatechange = () => { if (pc && pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } }; });
    if (pc && ws && ws.readyState === 1) ws.send(JSON.stringify({ webrtc: 'answer', sdp: pc.localDescription.sdp }));
  } catch { rtcStop(true); }
}
connect();
</script></body></html>
